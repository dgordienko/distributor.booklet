# Override for running behind the existing shared nginx (dswapi.online).
#
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
#
# Both services join only the existing shared docker network: no project
# network is created (the server's Docker address pools are exhausted, and a
# separate network is not needed). nginx reaches the admin as
# "booklet-admin:8080" (see deploy/nginx-booklet.conf); the admin reaches the
# backend as "booklet-backend:4000". Nothing is published on the host, so the
# only way in is through nginx with TLS. Requires Docker Compose >= 2.24 for
# `!reset`.
services:
  booklet-backend:
    ports: !reset []
    networks:
      - shared

  booklet-admin:
    ports: !reset []
    networks:
      - shared

networks:
  shared:
    external: true
    name: ${SHARED_NETWORK:-distributor-api-shared-network}
