server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend has no explicit upload size cap (multer/express defaults), so
    # nginx's own 1m default would otherwise be the binding limit on image
    # uploads (product photos, category images, brand logo).
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        application/xml text/xml image/svg+xml font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Resolve the backend through Docker's embedded DNS at request time instead
    # of once at startup: when the backend container is restarted or recreated
    # (upgrade, backup) it may get a new IP, and a cached address would turn
    # every API call into a 502 until this container is restarted too.
    # With a variable and no URI part, proxy_pass forwards the original URI
    # unchanged (/api/... -> /api/..., /uploads/... -> /uploads/...).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://booklet-backend:4000;

    # Proxied to the backend service on the docker network — same-origin from
    # the browser's point of view, so no CORS config needed on either side.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Hashed filenames (Vite build output) can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router client-side routing: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
