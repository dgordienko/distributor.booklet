server {
    listen 80;
    server_name dswapi.online;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

upstream booklet_admin {
    server booklet-admin:8080;
}

upstream dagster_backend {
    server 192.168.122.1:8091;
}

upstream hangfire_backend {
    server 192.168.122.1:8092;
}

upstream hermes_mobile_api {
    server hermes.mobile.api:8000;
}

upstream hermes_web_dashboard {
    server 192.168.96.1:8181;
}

upstream hermes_minio_tiles {
    server 192.168.96.1:9000;
}

upstream distributor_api_facade {
    server 192.168.122.1:8000;
}

upstream distributor_api_service {
    server 192.168.122.1:8000;
}

upstream distributor_wms_api {
    server distributor-wms-api:8286;
}

upstream distributor_wms_report {
    server 192.168.122.1:8187;
}

server {
    listen 443 ssl;
    server_name dswapi.online;
    client_max_body_size 20m;
    client_body_buffer_size 512k;

    # Proxy buffering optimization for large responses (up to 8MB)
    proxy_buffer_size 128k;
    proxy_buffers 64 128k;
    proxy_busy_buffers_size 256k;

    ssl_certificate /etc/letsencrypt/live/dswapi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dswapi.online/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dswapi.online/chain.pem;

    # Modern SSL configuration with improved compatibility
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256;

    # Session optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets on; # Enabled for better compatibility with some .NET clients

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Performance optimization
    ssl_buffer_size 4k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log notice;

    # Restriction of HTTP methods (added OPTIONS for CORS)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
        return 405;
    }

    # Block access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common scanner paths (stricter matching)
    location ~* ^/(boaform|phpmyadmin|setup\.php|xmlrpc\.php|wp-admin) {
        return 444;
    }
    location ~* /(admin|config)($|/) {
        return 444;
    }

    # Booklet admin: redirect without trailing slash. Must live in the 443
    # server (Auth0 callback lands on /booklet?code=...&state=...); the query
    # string is preserved by $is_args$args.
    location = /booklet {
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    # Booklet admin (SPA + /api + /uploads, all behind the same prefix).
    # `^~` makes this win over the regex blocks (/admin|config scanners etc.).
    # The trailing slash in proxy_pass strips the /booklet/ prefix; the
    # admin container's own nginx serves /, /assets/, /api/ and /uploads/.
    location ^~ /booklet/ {
        # add_header in a location cancels inheritance of server-level
        # add_header, so HSTS must be repeated here (as in the other locations).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic off;
        client_max_body_size 20m;
        proxy_pass http://booklet_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Booklet-Admin";
    }

    # Dagster интерфейс
    location ^~ /dagster/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://dagster_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dagster/;
        proxy_set_header Accept-Encoding "";
        sub_filter '"_next/static/' '"/dagster/_next/static/';
        sub_filter '/_next/static/css/' '/dagster/_next/static/css/';
        sub_filter '"/manifest.json"' '"/dagster/manifest.json"';
        sub_filter_once off;
        add_header X-Debug "Dagster";
    }

    # Перехватываем все запросы к _next/static/
    location /_next/static/ {
        proxy_pass http://dagster_backend/_next/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Dagster-Static";
    }

    # Перехватываем manifest.json
    location = /manifest.json {
        proxy_pass http://dagster_backend/manifest.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Dagster-Manifest";
    }

    # Добавляем GraphQL
    location /graphql {
        proxy_pass http://dagster_backend/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
# Добавляем поддержку WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Debug "Dagster-GraphQL";
    }

    location ~ ^/(overview|assets|runs|jobs|pipelines|schedules|sensors|locations|deployment) {
        proxy_pass http://dagster_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dagster/;
        try_files $uri @dagster_fallback; # Если маршрут не обработан, переходим в fallback
        add_header X-Debug "Dagster-Routes";
    }

    # Fallback для Dagster
    location @dagster_fallback {
        proxy_pass http://dagster_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /dagster/;
        add_header X-Debug "Dagster-Fallback";
    }

    # Доступ через /hangfire/
    location ^~ /hangfire/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://hangfire_backend/hangfire/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hangfire";
    }

    # OpenAPI для Hermes (исправлено)
    location = /hermes/openapi.json {
        proxy_pass http://hermes_mobile_api/hermes/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes-OpenAPI";
    }

    # Документация Hermes
    location = /hermes/docs {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://hermes_mobile_api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes-Docs";
    }

    location = /hermes/redoc {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://hermes_mobile_api/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes-Redoc";
    }

    # Редирект без слэша для нового дашборда
    location = /hermes-dashboard {
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    # Новый дашборд Hermes
    location ^~ /hermes-dashboard/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://hermes_web_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes-Dashboard";
        add_header X-Upstream-Status $upstream_status;
    }

    # Тайлы карты Hermes (MinIO, публичное чтение, поддержка Range-запросов)
    location ^~ /tiles/ {
        proxy_pass http://hermes_minio_tiles/hermes-tiles/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        add_header X-Debug "Hermes-Tiles";
    }

    # Прозрачное проксирование старых ссылок Hermes API на новый дашборд
    location = /hermes/api/map/clear {
        rewrite ^ /map break;
        proxy_pass http://hermes_web_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes-Dashboard-Rewrite";
    }

    # Все остальные запросы с /hermes/
    location ^~ /hermes/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://hermes_mobile_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Hermes";
        add_header X-Upstream-Status $upstream_status;  # Статус от upstream
    }

    # Документация для distributor-mobile-api-facade
    location = /docs {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://distributor_api_facade/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Serial-Number $http_serial_number;
        proxy_set_header Client-Version $http_client_version;
        add_header X-Debug "Facade-Docs";
    }

    location = /redoc {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://distributor_api_facade/redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Facade-Redoc";
    }

    # OpenAPI для distributor-mobile-api-facade
    location = /openapi.json {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://distributor_api_facade/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Facade-OpenAPI";
    }

    # API маршруты для distributor api сервиса
    location ^~ /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic off;
        proxy_pass http://distributor_api_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Serial-Number $http_serial_number;
        proxy_set_header Client-Version $http_client_version;
        add_header X-Debug "Distributor-API";
    }

    # Редирект без слэша для WMS Report
    location = /wms/report {
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    # WMS Report (backend/api service, on distributor-api-shared-network)
    location ^~ /wms/report/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic off;
        proxy_pass http://distributor_wms_report/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /wms/report;
        add_header X-Debug "WMS-Report";
    }

    # WMS Mobile API (backend/api service, on distributor-api-shared-network)
    location ^~ /wms/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic off;
        proxy_pass http://distributor_wms_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /wms;
        add_header X-Debug "WMS-API";
    }

    # Основной сервис
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass http://distributor_api_facade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Serial-Number $http_serial_number;
        proxy_set_header Client-Version $http_client_version;
        add_header X-Debug "Facade";
    }
}
