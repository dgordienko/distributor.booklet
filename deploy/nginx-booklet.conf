# Add to the existing nginx config for dswapi.online.
#
# 1) At http{} level, next to the other upstreams in app.conf:
upstream booklet_admin {
    server booklet-admin:8080;
}

# 2) Inside `server { listen 443 ssl; server_name dswapi.online; ... }`,
#    anywhere before `location / { ... }`:

    # Without the trailing slash, redirect (query string is preserved —
    # the Auth0 callback lands here with ?code=...&state=...).
    location = /booklet {
        return 301 $scheme://$http_host$uri/$is_args$args;
    }

    # Booklet admin (SPA + /api + /uploads, all behind the same prefix).
    # `^~` makes this win over the regex blocks (/admin|config scanners etc.).
    # The trailing slash in proxy_pass strips the /booklet/ prefix; the
    # admin container's own nginx serves /, /assets/, /api/ and /uploads/.
    location ^~ /booklet/ {
        # add_header in a location cancels inheritance of server-level
        # add_header, so HSTS must be repeated here (as in the other locations).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        auth_basic off;
        client_max_body_size 20m;
        proxy_pass http://booklet_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Debug "Booklet-Admin";
    }
